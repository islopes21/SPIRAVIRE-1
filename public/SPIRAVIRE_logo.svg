<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">SPIRAVIRE logo</title>
  <desc id="desc">Logo combining a spiro-beta-lactam molecular motif with a respiratory virus and lung motif, followed by the SPIRAVIRE wordmark.</desc>

  <defs>
    <linearGradient id="virusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18B7A0"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="55%" stop-color="#1769AA"/>
      <stop offset="100%" stop-color="#13A995"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- Molecular / spiro-beta-lactam motif -->
  <g fill="none" stroke="#123B63" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="170,300 255,250 340,300 340,395 255,445 170,395"/>
    <line x1="170" y1="347" x2="95" y2="347"/>
    <line x1="340" y1="300" x2="405" y2="235"/>
    <line x1="340" y1="395" x2="425" y2="455"/>
    <path d="M405 235 L485 300 L485 395 L405 455"/>
    <line x1="485" y1="300" x2="585" y2="300"/>
    <line x1="485" y1="395" x2="555" y2="395"/>
    <line x1="555" y1="395" x2="585" y2="430"/>
    <line x1="425" y1="455" x2="390" y2="515"/>
    <line x1="410" y1="465" x2="375" y2="525"/>
    <line x1="390" y1="515" x2="350" y2="555"/>
    <circle cx="340" cy="575" r="25"/>
  </g>

  <g fill="#123B63" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="55" y="365" font-size="38">R</text>
    <text x="585" y="318" font-size="38">N</text>
    <text x="320" y="620" font-size="34">O</text>
  </g>

  <!-- Connector / spiro flow -->
  <path d="M505 300 C585 250 610 205 640 160"
        fill="none" stroke="#123B63" stroke-width="14" stroke-linecap="round"/>

  <!-- Respiratory virus / lung motif -->
  <g transform="translate(780 290)">
    <circle cx="0" cy="0" r="150" fill="url(#virusGrad)" opacity="0.12"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#virusGrad)" stroke-width="12"/>

    <!-- Virus spikes -->
    <g stroke="url(#virusGrad)" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="-130" x2="0" y2="-175"/>
      <line x1="92" y1="-92" x2="123" y2="-123"/>
      <line x1="130" y1="0" x2="175" y2="0"/>
      <line x1="92" y1="92" x2="123" y2="123"/>
      <line x1="0" y1="130" x2="0" y2="175"/>
      <line x1="-92" y1="92" x2="-123" y2="123"/>
      <line x1="-130" y1="0" x2="-175" y2="0"/>
      <line x1="-92" y1="-92" x2="-123" y2="-123"/>
    </g>
    <g fill="#18AFA0">
      <circle cx="0" cy="-180" r="13"/>
      <circle cx="128" cy="-128" r="13"/>
      <circle cx="180" cy="0" r="13"/>
      <circle cx="128" cy="128" r="13"/>
      <circle cx="0" cy="180" r="13"/>
      <circle cx="-128" cy="128" r="13"/>
      <circle cx="-180" cy="0" r="13"/>
      <circle cx="-128" cy="-128" r="13"/>
    </g>

    <!-- Stylized lungs / airways -->
    <g fill="none" stroke="#0E8F8B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -75 L0 -20"/>
      <path d="M0 -20 C-18 -5 -25 5 -32 25 C-42 55 -62 82 -82 88 C-102 94 -112 72 -108 48 C-104 25 -92 5 -82 -10 C-65 -35 -50 -55 -28 -62"/>
      <path d="M0 -20 C18 -5 25 5 32 25 C42 55 62 82 82 88 C102 94 112 72 108 48 C104 25 92 5 82 -10 C65 -35 50 -55 28 -62"/>
      <path d="M-30 25 L-62 10 M-42 55 L-75 45 M30 25 L62 10 M42 55 L75 45"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="600" y="610" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112" font-weight="800" letter-spacing="4" fill="url(#wordGrad)">
    SPIRAVIRE
  </text>

  <!-- Tagline -->
  <text x="600" y="680" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="500" fill="#36546B">
    Spiro-β-lactams as Therapeutic Agents Against
  </text>
  <text x="600" y="720" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="500" fill="#36546B">
    RNA Virus-Induced Respiratory Infections
  </text>
</svg>
